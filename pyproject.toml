[project]
name = "be-shell-python"
version = "0.1.0"
description = "Python 外壳的启动器（阶段四），不是 brickKit 组件、不进 brickkit.yaml"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "besdk @ git+https://github.com/brickKit/be-sdk-python.git@v0.3.3",
    "yoyo-migrations==9.0.0",
    "psycopg2-binary==2.9.10",
    # 阶段四 Task 7：本仓库唯一真实要装的 Python 组件。infra-print 自己的
    # 顶层包名字面量是 "app"（backend/pyproject.toml 的既有约定，见它自己
    # AGENTS.md 的坑清单）——本仓库目前只装这一个 Python 模块，不会撞见
    # 包名冲突；真的有第二个 Python 组件加入 py-render 时，这是第一个
    # 要重新核对的地方。v1.0.5：infra-print 自己的 besdk 依赖从 v0.3.1
    # 升到 v0.3.3，跟本仓库对齐（两边 git URL 依赖里的 besdk tag 必须
    # 完全一致，pip/uv 才能解析出一份，见这次真机撞到的冲突）。
    "infra-print @ git+https://github.com/brickKit/infra-print.git@v1.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.2.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shell*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
